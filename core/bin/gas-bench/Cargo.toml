[package]
name = "gas-bench"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }

tokio = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true, features = ["derive"] }
prettytable-rs = "^0.10"

primitives = { path = "../../crates/primitives" }
bsv_home_client = { path = "../../crates/bsv_home_client", features = ["reqwest"] }
bsv_home_core = { path = "../../bsv_home_core", features = ["reqwest_provider"] }
bsv_home_evm = { path = "../../crates/bsv_home_evm" }
bsv_home_solana = { path = "../../crates/bsv_home_solana", features = ["reqwest"] }
bsv_home_jsonrpc = { path = "../../crates/bsv_home_jsonrpc", features = ["client"] }
serde_serializers = { path = "../../crates/serde_serializers" }
