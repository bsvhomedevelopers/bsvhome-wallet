[package]
name = "bsv_home_bsv"
version = { workspace = true }
edition = { workspace = true }
publish = false

[features]
default = []
testkit = []
signer = ["dep:bsv_home_bitcoin"]
rpc = ["signer", "dep:bsv_home_client", "dep:chain_traits", "dep:async-trait"]
reqwest = ["rpc", "bsv_home_client/reqwest"]

[dependencies]
base64 = { workspace = true }
primitives = { path = "../primitives" }
bsv_home_bitcoin = { path = "../bsv_home_bitcoin", features = ["signer"], optional = true }
bitcoin = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
number_formatter = { path = "../number_formatter" }
chrono = { workspace = true }
zeroize = { workspace = true }
bsv_home_tracing = { path = "../tracing" }
bsv_home_client = { path = "../bsv_home_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
futures = { workspace = true }
async-trait = { workspace = true, optional = true }

[dev-dependencies]
primitives = { path = "../primitives", features = ["testkit"] }
bsv_home_client = { path = "../bsv_home_client", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "read_only"
required-features = ["reqwest"]
