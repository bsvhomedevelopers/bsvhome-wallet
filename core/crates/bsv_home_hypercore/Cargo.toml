[package]
name = "bsv_home_hypercore"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
reqwest = ["bsv_home_client/reqwest"]
signer = []
testkit = []
chain_integration_tests = ["reqwest", "settings/testkit"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
num-bigint = { workspace = true }
alloy-primitives = { workspace = true }
rmp-serde = { version = "1.3.1" }
futures = { workspace = true }
strum = { workspace = true }
zeroize = { workspace = true }

bsv_home_client = { path = "../bsv_home_client" }
bsv_home_hash = { path = "../bsv_home_hash" }
bsv_home_evm = { path = "../bsv_home_evm" }
serde_serializers = { path = "../serde_serializers" }
number_formatter = { path = "../number_formatter" }
primitives = { path = "../primitives" }
chain_traits = { path = "../chain_traits" }
k256 = { workspace = true }
signer = { path = "../signer" }

[dev-dependencies]
bsv_home_client = { path = "../bsv_home_client", features = ["reqwest", "testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
primitives = { path = "../primitives", features = ["testkit"] }
settings = { path = "../settings", features = ["testkit"] }
