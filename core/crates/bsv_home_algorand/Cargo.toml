[package]
name = "bsv_home_algorand"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = ["dep:async-trait", "dep:chrono", "dep:chain_traits", "dep:bsv_home_client"]
signer = ["dep:hex", "dep:num-traits"]
reqwest = ["bsv_home_client/reqwest"]
chain_integration_tests = ["rpc", "reqwest", "settings/testkit"]

[dependencies]
async-trait = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
bsv_home_encoding = { path = "../bsv_home_encoding", features = ["base32"] }
num-bigint = { workspace = true }
num-traits = { workspace = true, optional = true }

chrono = { workspace = true, optional = true }

primitives = { path = "../primitives" }
chain_traits = { path = "../chain_traits", optional = true }
bsv_home_client = { path = "../bsv_home_client", optional = true }
bsv_home_hash = { path = "../bsv_home_hash" }
hex = { workspace = true, optional = true }
signer = { path = "../signer" }

[dev-dependencies]
chain_traits = { path = "../chain_traits", features = ["testkit"] }
bsv_home_client = { path = "../bsv_home_client", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }
settings = { path = "../settings", features = ["testkit"] }
primitives = { path = "../primitives", features = ["testkit"] }
hex = { workspace = true }
