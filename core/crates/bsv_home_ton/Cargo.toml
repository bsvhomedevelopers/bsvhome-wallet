[package]
name = "bsv_home_ton"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = [
    "dep:async-trait",
    "dep:bsv_home_client",
    "dep:chain_traits",
    "dep:futures",
]
tvm = ["dep:bsv_home_hash"]
signer = ["tvm", "dep:signer"]
reqwest = ["bsv_home_client/reqwest"]
chain_integration_tests = ["rpc", "reqwest", "primitives/testkit", "settings/testkit"]

[dependencies]
hex = { workspace = true }
crc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
primitives = { path = "../primitives" }
num-bigint = { workspace = true }
bsv_home_encoding = { path = "../bsv_home_encoding" }

serde_serializers = { path = "../serde_serializers", features = ["bigint"] }

# Optional RPC dependencies
async-trait = { workspace = true, optional = true }
bsv_home_client = { path = "../bsv_home_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
futures = { workspace = true, optional = true }

# Optional signer dependencies
signer = { path = "../signer", optional = true }
bsv_home_hash = { path = "../bsv_home_hash", optional = true }

[dev-dependencies]
chain_traits = { path = "../chain_traits", features = ["testkit"] }
bsv_home_client = { path = "../bsv_home_client", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }
settings = { path = "../settings", features = ["testkit"] }
primitives = { path = "../primitives", features = ["testkit"] }
