[package]
name = "daemon"
edition = { workspace = true }
version = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
rocket = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
strum = { workspace = true }
async-trait = { workspace = true }
num-bigint = { workspace = true }

prometheus-client = { workspace = true }
metrics = { path = "../../crates/metrics" }
bsv_home_tracing = { path = "../../crates/tracing" }
settings = { path = "../../crates/settings" }
storage = { path = "../../crates/storage" }
api_connector = { path = "../../crates/api_connector" }
coingecko = { path = "../../crates/coingecko" }
lists = { path = "../../crates/lists" }
pricer = { path = "../../crates/pricer" }
prices = { path = "../../crates/prices" }
primitives = { path = "../../crates/primitives" }
fiat = { path = "../../crates/fiat" }
nft = { path = "../../crates/nft" }
job_runner = { path = "../../crates/job_runner" }
search_index = { path = "../../crates/search_index" }
cacher = { path = "../../crates/cacher" }
streamer = { path = "../../crates/streamer" }
localizer = { path = "../../crates/localizer" }
support = { path = "../../crates/support" }
settings_chain = { path = "../../crates/settings_chain" }
chain_traits = { path = "../../crates/chain_traits" }
number_formatter = { path = "../../crates/number_formatter" }
bsv_home_rewards = { path = "../../crates/bsv_home_rewards" }
bsv_home_client = { path = "../../crates/bsv_home_client", features = ["reqwest"] }
bsv_home_evm = { path = "../../crates/bsv_home_evm", features = ["rpc", "reqwest"] }
bsv_home_jsonrpc = { path = "../../crates/bsv_home_jsonrpc", features = ["client", "reqwest"] }
swapper = { path = "../../crates/swapper", features = ["reqwest_provider"] }
security_provider = { path = "../../crates/security_provider" }

[dev-dependencies]
primitives = { path = "../../crates/primitives", features = ["testkit"] }
storage = { path = "../../crates/storage", features = ["testkit"] }
