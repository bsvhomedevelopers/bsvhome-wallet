[bindings.kotlin]
cdylib_name = "gemstone"
package_name = "uniffi.gemstone"

[bindings.swift]
ffi_module_name = "BsvHomeCoreFFI"
generate_module_map = false
experimental_sendable_value_types = true
omit_localized_error_conformance = true
[bindings.kotlin.custom_types.BsvHomeBigInt]
type_name = "java.math.BigInteger"
lift = "java.math.BigInteger({})"
lower = "{}.toString()"

[bindings.kotlin.custom_types.BsvHomeBigUint]
type_name = "java.math.BigInteger"
lift = "java.math.BigInteger({})"
lower = "{}.toString()"

[bindings.swift.custom_types.BsvHomeBigInt]
type_name = "BigInt"
imports = ["BigInt"]
lift = "BigInt(stringLiteral: {})"
lower = "{}.description"

[bindings.swift.custom_types.BsvHomeBigUint]
type_name = "BigUInt"
imports = ["BigInt"]
lift = "BigUInt(stringLiteral: {})"
lower = "{}.description"

[bindings.kotlin.custom_types.DateTimeUtc]
type_name = "Long"
lift = "{} * 1000"
lower = "{} / 1000"

[bindings.swift.custom_types.DateTimeUtc]
type_name = "Date"
lift = "Date(timeIntervalSince1970: TimeInterval({}))"
lower = "Int64({}.timeIntervalSince1970)"
